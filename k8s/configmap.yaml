apiVersion: v1
kind: ConfigMap
metadata:
  name: critr-config
  namespace: critr
  labels:
    app.kubernetes.io/name: critr
data:
  APP_ENV: "production"
  WEB_SEARCH_ENABLED: "false"
  LLM_PROVIDER: "none"
  TICKET_PORT: "fake"
  DEV_LOGIN_ENABLED: "true"
  KNOWLEDGE_DIR: "/app/knowledge/tickets"
  RESPONSIBLES_DIR: "/app/config/responsibles"
  PRIORITY_KEYWORDS_PATH: "/app/config/priority_keywords.md"
  TOPICS_DIR: "/app/config/topics"
  RISKS_DIR: "/app/config/risks"

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: critr-app
  namespace: critr
  labels:
    app.kubernetes.io/name: critr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: critr
      app.kubernetes.io/component: app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: critr
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    # HTTPS Egress (Jira / LLM Gateway) — bei Bedarf enger auf CIDRs begrenzen
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: critr-postgres
  namespace: critr
  labels:
    app.kubernetes.io/name: critr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: critr
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: critr
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: 5432
  egress: []

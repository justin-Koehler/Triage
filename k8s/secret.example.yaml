# Vorlage — echte Werte nicht committen.
# kubectl -n critr create secret generic critr-secrets \
#   --from-literal=SESSION_SECRET='…' \
#   --from-literal=SETTINGS_ENCRYPTION_KEY='…' \
#   --from-literal=DATABASE_URL='postgresql+psycopg://critr:…@postgres:5432/critr' \
#   --from-literal=POSTGRES_PASSWORD='…'
#
# Oder dieses File kopieren, Werte setzen, anwenden (nicht ins Git).
apiVersion: v1
kind: Secret
metadata:
  name: critr-secrets
  namespace: critr
  labels:
    app.kubernetes.io/name: critr
type: Opaque
stringData:
  SESSION_SECRET: "REPLACE_ME"
  SETTINGS_ENCRYPTION_KEY: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgresql+psycopg://critr:REPLACE_ME@postgres:5432/critr"

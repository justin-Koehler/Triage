# CRITR — Docker Compose (Caddy → App → Postgres)
# Caddy ist der einzige exponierte Einstieg. App und Postgres bleiben intern.
#
# Start:
#   cp deploy/compose.env.example deploy/compose.env   # Secrets setzen
#   docker compose --env-file deploy/compose.env up --build -d
#
# Image-Tag nie "latest" in Prod — SHA oder SemVer setzen:
#   IMAGE_TAG=abc1234 docker compose up -d

name: critr

networks:
  proxy_network:
    driver: bridge
  backend_network:
    driver: bridge

volumes:
  postgres_data:

services:
  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - proxy_network
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data

  app:
    image: critr:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - deploy/compose.env
    # Secrets (SESSION_SECRET, SETTINGS_ENCRYPTION_KEY, …) kommen aus env_file —
    # nicht hier per ${VAR} setzen, sonst überschreibt leere Shell-Env die Werte.
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-critr}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-critr}
      KNOWLEDGE_DIR: /app/knowledge/tickets
      RESPONSIBLES_DIR: /app/config/responsibles
      PRIORITY_KEYWORDS_PATH: /app/config/priority_keywords.md
      TOPICS_DIR: /app/config/topics
      RISKS_DIR: /app/config/risks
    networks:
      - proxy_network
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-critr}
      POSTGRES_USER: ${POSTGRES_USER:-critr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    security_opt:
      - no-new-privileges:true
    # Postgres braucht u.a. CHOWN/SETUID — kein cap_drop ALL hier.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-critr} -d ${POSTGRES_DB:-critr}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

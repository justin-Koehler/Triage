<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kostenkalkulation — CRITR</title>
    <link rel="stylesheet" href="/styles.css?v=v0-2-4" />
  </head>
  <body class="effort-sheet-page">
    <header class="effort-sheet-chrome">
      <a class="brand" href="/workspace">CRITR</a>
      <p class="effort-sheet-chrome-meta">Kostenkalkulation</p>
    </header>
    <main class="effort-sheet-main">
      <header class="effort-sheet-head">
        <p class="effort-sheet-kicker" id="kalk-for">Change</p>
        <h1>Kosten Kalkulation</h1>
        <p class="effort-sheet-note">Personentage und Sach-/Lizenzkosten je Phase eintragen.</p>
        <p class="effort-sheet-note">
          Speichern übernimmt Kosten, Sachkosten und Gesamtsumme ins Ticket.
        </p>
      </header>
      <div id="kalk" class="kalk"></div>
      <div class="kalk-bar">
        <button type="button" class="btn btn-primary" id="kalk-save">Speichern und schließen</button>
      </div>
    </main>
    <script src="/effort-sheet.js?v=v0-2-4"></script>
  </body>
</html>

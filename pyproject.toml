[project]
name = "cms"
version = "0.1.0"
description = "CRITR — Change-Management, eigener Workspace, Jira nur als Adapter"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "node_modules", "web", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "eval: Triage-Qualitaetsmessung gegen das Golden Set (braucht LLM)",
]
